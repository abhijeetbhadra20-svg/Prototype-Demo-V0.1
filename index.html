<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Companion - Phase 3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Three.js & GLTF 3D Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting (Taaki 3D model properly dikhe)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        camera.position.set(0, 1.2, 3.2);

        let mixer, character, animations = {};

        // 3D Robot Model Load karna (Official Three.js CDN Model)
        const loader = new THREE.GLTFLoader();
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            character = gltf.scene;
            character.position.y = -1; // Center position
            scene.add(character);

            mixer = new THREE.AnimationMixer(character);
            gltf.animations.forEach((clip) => {
                animations[clip.name] = mixer.clipAction(clip);
            });

            // Default Idle Animation
            if (animations['Idle']) {
                animations['Idle'].play();
            }
        });

        // Touch Event (Tap karne par Robot Jump karega)
        window.addEventListener('pointerdown', () => {
            if (mixer && animations['Jump']) {
                if (animations['Idle']) animations['Idle'].stop();
                
                animations['Jump'].reset().play();

                setTimeout(() => {
                    animations['Jump'].stop();
                    if (animations['Idle']) animations['Idle'].play();
                }, 1000);
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
