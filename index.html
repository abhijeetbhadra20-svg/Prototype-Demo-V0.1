<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Gadget AI — Full 3D Space V0.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#85898d;font-family:system-ui,sans-serif;touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:12px;left:12px;z-index:5;padding:7px 10px;border:1px solid #ffffff2b;border-radius:9px;background:#30343ab8;color:#fff;font-size:12px;backdrop-filter:blur(7px)}
#reset{position:fixed;right:12px;top:12px;z-index:6;border:1px solid #ffffff2b;border-radius:9px;background:#30343ab8;color:#fff;padding:7px 11px}
#joy{position:fixed;left:18px;bottom:18px;width:108px;height:108px;border:1px solid #ffffff30;border-radius:50%;background:#ffffff12;z-index:7}.stick{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffff35;border:1px solid #ffffff35}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#ffffff88;font-size:11px;z-index:4;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head>
<body><div id="app"></div><div id="top">GADGET AI · FULL 3D SPACE V0.5</div><button id="reset">Reset</button><div id="joy"><div class="stick"></div></div><div id="hint">Drag to look · pinch / wheel to zoom · joystick / WASD to move</div>
<script type="module">
import * as THREE from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
const app=document.getElementById("app"),scene=new THREE.Scene();scene.background=new THREE.Color(0x85898d);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;app.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,1000);const HOME=new THREE.Vector3(8,5.8,11),TARGET=new THREE.Vector3(0,0,0);camera.position.copy(HOME);
scene.add(new THREE.HemisphereLight(0xffffff,0x50545a,1.25));const light=new THREE.DirectionalLight(0xffffff,1.4);light.position.set(40,80,30);scene.add(light);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x85898d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const grid=new THREE.Group();scene.add(grid);
const minor=new THREE.GridHelper(300,150,0xaeb3b8,0x74797e),major=new THREE.GridHelper(300,30,0xcbd0d4,0x5f656b);minor.material.transparent=true;minor.material.opacity=.2;major.material.transparent=true;major.material.opacity=.45;grid.add(minor,major);
const axes=new THREE.AxesHelper(2.5);axes.material.transparent=true;axes.material.opacity=.4;scene.add(axes);
const origin=new THREE.Mesh(new THREE.RingGeometry(.7,.72,48),new THREE.MeshBasicMaterial({color:0x555b60,transparent:true,opacity:.35,side:THREE.DoubleSide}));origin.rotation.x=-Math.PI/2;origin.position.y=.01;scene.add(origin);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;controls.zoomToCursor=true;controls.minDistance=1.2;controls.maxDistance=450;controls.maxPolarAngle=Math.PI*.96;controls.target.copy(TARGET);
const keys=new Set;addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
const joy=document.getElementById("joy"),stick=joy.querySelector(".stick");let pid=null,jx=0,jy=0;
function moveJoy(x,y){const r=joy.getBoundingClientRect(),dx0=x-(r.left+r.width/2),dy0=y-(r.top+r.height/2),m=r.width*.31,l=Math.hypot(dx0,dy0),dx=l>m?dx0/l*m:dx0,dy=l>m?dy0/l*m:dy0;jx=dx/m;jy=dy/m;stick.style.transform=`translate3d(${dx}px,${dy}px,0)`}
function up(){pid=null;jx=jy=0;stick.style.transform="translate3d(0,0,0)"}joy.addEventListener("pointerdown",e=>{pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e.clientX,e.clientY)});joy.addEventListener("pointermove",e=>{if(e.pointerId===pid)moveJoy(e.clientX,e.clientY)});joy.addEventListener("pointerup",up);joy.addEventListener("pointercancel",up);
const dir=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3();
function movement(dt){let x=jx,z=jy;if(keys.has("w")||keys.has("arrowup"))z--;if(keys.has("s")||keys.has("arrowdown"))z++;if(keys.has("a")||keys.has("arrowleft"))x--;if(keys.has("d")||keys.has("arrowright"))x++;const l=Math.hypot(x,z);if(l<.01)return;x/=l;z/=l;camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();right.crossVectors(fwd,camera.up).normalize();dir.copy(fwd).multiplyScalar(-z).addScaledVector(right,x).normalize();const d=dt*5.5;camera.position.addScaledVector(dir,d);controls.target.addScaledVector(dir,d)}
document.getElementById("reset").onclick=()=>{camera.position.copy(HOME);controls.target.copy(TARGET);controls.update()};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* --- PROCEDURAL COMPANION --- */
function makeCompanion(){
  const root=new THREE.Group();
  root.position.set(0,0,0);
  root.name="DoraemonPrototype";

  const blue=new THREE.MeshStandardMaterial({color:0x168dcc,roughness:.72,metalness:.03});
  const blueDark=new THREE.MeshStandardMaterial({color:0x0874ad,roughness:.8});
  const white=new THREE.MeshStandardMaterial({color:0xf5f5f2,roughness:.65});
  const black=new THREE.MeshStandardMaterial({color:0x101215,roughness:.45});
  const red=new THREE.MeshStandardMaterial({color:0xd92828,roughness:.55});
  const yellow=new THREE.MeshStandardMaterial({color:0xf2c328,roughness:.48,metalness:.08});

  const add=(geo,mat,pos,scale=[1,1,1])=>{
    const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;root.add(m);return m;
  };

  // body
  add(new THREE.SphereGeometry(1,32,20),blue,[0,1.38,0],[.9,1.05,.72]);

  // head
  const head=add(new THREE.SphereGeometry(1,40,28),blue,[0,2.65,0],[1.16,1.12,.92]);

  // white face / muzzle
  add(new THREE.SphereGeometry(1,40,24),white,[0,2.53,-.79],[.91,.78,.20]);

  // eyes
  for(const x of [-.29,.29]){
    add(new THREE.SphereGeometry(.23,24,16),white,[x,2.96,-.83],[1,.98,.42]);
    add(new THREE.SphereGeometry(.075,18,12),black,[x,2.96,-1.02],[1,1,.55]);
  }

  // nose
  add(new THREE.SphereGeometry(.105,20,16),red,[0,2.70,-1.01],[1,1,.65]);

  // mouth
  const mouth=new THREE.Mesh(
    new THREE.TorusGeometry(.30,.025,8,32,Math.PI),
    black
  );
  mouth.position.set(0,2.37,-1.00);mouth.rotation.z=Math.PI;root.add(mouth);

  // neck collar
  add(new THREE.TorusGeometry(.69,.075,12,48),red,[0,1.95,0],[1,1,.72]);

  // bell
  add(new THREE.SphereGeometry(.15,24,16),yellow,[0,1.82,-.69],[1,1,.72]);
  add(new THREE.TorusGeometry(.07,.025,8,24),yellow,[0,1.76,-.79],[1,1,.8]);

  // arms
  for(const side of [-1,1]){
    const arm=add(new THREE.SphereGeometry(.38,24,18),blue,[side*.82,1.50,0],[.46,.82,.48]);
    arm.rotation.z=side*.35;
    add(new THREE.SphereGeometry(.20,22,16),white,[side*1.03,1.03,-.02],[.85,.72,.85]);
  }

  // legs + feet
  for(const side of [-1,1]){
    add(new THREE.SphereGeometry(.38,24,18),blue,[side*.39,.72,0],[.52,.72,.55]);
    add(new THREE.SphereGeometry(.48,28,18),white,[side*.45,.38,-.23],[1.0,.58,1.15]);
  }

  // red tail
  add(new THREE.SphereGeometry(.16,20,14),red,[0,1.10,.70],[1,1,.75]);

  // whiskers as thin cylinders
  const whisker=(y,side)=>{
    const len=.55;
    const g=new THREE.CylinderGeometry(.012,.012,len,8);
    const w=new THREE.Mesh(g,black);
    w.position.set(side*.42,y,-1.00);
    w.rotation.z=Math.PI/2 + side*(y>2.52?.08:-.08);
    root.add(w);
  };
  [-.13,0,.13].forEach((dy,i)=>{whisker(2.53+dy,-1);whisker(2.53+dy,1)});

  // subtle grounding shadow
  const shadow=new THREE.Mesh(
    new THREE.CircleGeometry(1.05,32),
    new THREE.MeshBasicMaterial({color:0x3b4045,transparent:true,opacity:.20})
  );
  shadow.rotation.x=-Math.PI/2;shadow.position.y=.015;shadow.scale.set(1,.58,1);root.add(shadow);

  return root;
}
const companion=makeCompanion();
scene.add(companion);
\nlet companionTime=0; const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);movement(dt);companionTime+=dt;companion.position.y=Math.sin(companionTime*2.0)*.025;companion.rotation.y=Math.sin(companionTime*.7)*.035;controls.update();renderer.render(scene,camera)}loop();
</script></body></html>
