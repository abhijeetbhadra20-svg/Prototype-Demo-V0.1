<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Project Gadget AI — 3D Environment</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #viewport { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 5;
      padding: 10px 12px; border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
      color: rgba(255,255,255,.85); font-size: 12px; line-height: 1.4;
      pointer-events: none; user-select: none;
    }
    #hud strong { display:block; color:#fff; font-size:13px; margin-bottom:3px; }
    #controls {
      position: fixed; right: 14px; top: 14px; z-index: 5;
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
    }
    button {
      border: 1px solid rgba(255,255,255,.14); background: rgba(8,8,8,.75); color:#fff;
      border-radius: 9px; padding: 9px 11px; font: inherit; font-size:12px;
      touch-action: manipulation; cursor:pointer; backdrop-filter: blur(8px);
    }
    button:active { transform: translateY(1px); }
    #mobileHint {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index:5; color:rgba(255,255,255,.55); font-size:11px; text-align:center;
      padding:6px 9px; border-radius:8px; background:rgba(0,0,0,.42); pointer-events:none;
    }
    @media (min-width: 800px) { #mobileHint { bottom: 12px; } }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="hud">
    <strong>Project Gadget AI · Environment V0.1</strong>
    Blender-style black viewport + dense infinite grid
  </div>
  <div id="controls">
    <button id="reset">Reset View</button>
    <button id="gridToggle">Grid: ON</button>
    <button id="axesToggle">Axes: OFF</button>
  </div>
  <div id="mobileHint">Desktop: drag + wheel • Mobile: one-finger orbit, pinch zoom</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

    const viewport = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 3000);
    const DEFAULT_POS = new THREE.Vector3(4.5, 3.2, 6.5);
    camera.position.copy(DEFAULT_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.rotateSpeed = 0.65;
    controls.panSpeed = 0.85;
    controls.zoomSpeed = 1.0;
    controls.minDistance = 0.5;
    controls.maxDistance = 800;
    controls.maxPolarAngle = Math.PI * 0.495;

    // Blender-style dense grid: major + minor lines, on a dark ground plane.
    const gridGroup = new THREE.Group();
    scene.add(gridGroup);

    const GRID_SIZE = 1000;
    const GRID_DIVISIONS = 500;
    const grid = new THREE.GridHelper(GRID_SIZE, GRID_DIVISIONS, 0x33485f, 0x111a24);
    grid.material.transparent = true;
    grid.material.opacity = 0.84;
    grid.position.y = 0;
    gridGroup.add(grid);

    // Extremely subtle black ground plane to keep the grid visually readable.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.006;
    gridGroup.add(ground);

    // Temporary origin marker — this is where the real 3D character will be inserted later.
    const placeholder = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x708090 })
    );
    placeholder.position.y = 0.16;
    placeholder.visible = true;
    scene.add(placeholder);

    const axes = new THREE.AxesHelper(1.35);
    axes.visible = false;
    scene.add(axes);

    document.getElementById('reset').addEventListener('click', () => {
      camera.position.copy(DEFAULT_POS);
      controls.target.set(0, 0, 0);
      controls.update();
    });
    document.getElementById('gridToggle').addEventListener('click', (event) => {
      gridGroup.visible = !gridGroup.visible;
      event.currentTarget.textContent = `Grid: ${gridGroup.visible ? 'ON' : 'OFF'}`;
    });
    document.getElementById('axesToggle').addEventListener('click', (event) => {
      axes.visible = !axes.visible;
      event.currentTarget.textContent = `Axes: ${axes.visible ? 'ON' : 'OFF'}`;
    });

    // Simple keyboard navigation around the target: useful before we add a character controller.
    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      const tag = e.target?.tagName?.toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      keys.add(e.key.toLowerCase());
    });
    window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

    const tmpForward = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const tmpUp = new THREE.Vector3(0, 1, 0);
    function keyboardMove(dt) {
      let x = 0, z = 0, y = 0;
      if (keys.has('w') || keys.has('arrowup')) z -= 1;
      if (keys.has('s') || keys.has('arrowdown')) z += 1;
      if (keys.has('a') || keys.has('arrowleft')) x -= 1;
      if (keys.has('d') || keys.has('arrowright')) x += 1;
      if (keys.has('q')) y -= 1;
      if (keys.has('e') || keys.has(' ')) y += 1;
      if (!x && !z && !y) return;

      tmpForward.subVectors(controls.target, camera.position).normalize();
      tmpForward.y = 0;
      if (tmpForward.lengthSq() < 1e-8) tmpForward.set(0, 0, -1);
      tmpForward.normalize();
      tmpRight.crossVectors(tmpForward, tmpUp).normalize();

      const speed = Math.max(0.8, camera.position.distanceTo(controls.target) * 0.7) * dt;
      const delta = new THREE.Vector3();
      delta.addScaledVector(tmpRight, x * speed);
      delta.addScaledVector(tmpForward, -z * speed);
      delta.y += y * speed;
      camera.position.add(delta);
      controls.target.add(delta);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      keyboardMove(dt);
      controls.update();
      placeholder.rotation.y += dt * 0.15;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });
  </script>
</body>
</html>
