import * as THREE from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";import{GLTFLoader}from"three/addons/loaders/GLTFLoader.js";
const app=document.getElementById("app"),scene=new THREE.Scene();scene.background=new THREE.Color(0x85898d);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,1000);const HOME=new THREE.Vector3(6.6,4.35,-8.6),TARGET=new THREE.Vector3(0,1.75,-.15);camera.position.copy(HOME);
scene.add(new THREE.HemisphereLight(0xffffff,0x50545a,1.25));const light=new THREE.DirectionalLight(0xffffff,1.8);light.position.set(25,55,22);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.near=1;light.shadow.camera.far=120;scene.add(light);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x85898d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);

const minor=new THREE.GridHelper(300,150,0xaeb3b8,0x74797e),major=new THREE.GridHelper(300,30,0xcbd0d4,0x5f656b);minor.material.transparent=true;minor.material.opacity=.2;major.material.transparent=true;major.material.opacity=.45;grid.add(minor,major);
const axes=new THREE.AxesHelper(2.5);axes.material.transparent=true;axes.material.opacity=.4;scene.add(axes);
const origin=new THREE.Mesh(new THREE.RingGeometry(.7,.72,48),new THREE.MeshBasicMaterial({color:0x555b60,transparent:true,opacity:.35,side:THREE.DoubleSide}));origin.rotation.x=-Math.PI/2;origin.position.y=.01;scene.add(origin);

const joy=document.getElementById("joy"),stick=joy.querySelector(".stick");let pid=null,jx=0,jy=0;
function moveJoy(x,y){const r=joy.getBoundingClientRect(),dx0=x-(r.left+r.width/2),dy0=y-(r.top+r.height/2),m=r.width*.31,l=Math.hypot(dx0,dy0),dx=l>m?dx0/l*m:dx0,dy=l>m?dy0/l*m:dy0;jx=dx/m;jy=dy/m;stick.style.transform=`translate3d(${dx}px,${dy}px,0)`}
function up(){pid=null;jx=jy=0;stick.style.transform="translate3d(0,0,0)"}joy.addEventListener("pointerdown",e=>{pid=e.pointerId;joy.setPointerCapture(pid);moveJoy(e.clientX,e.clientY)});joy.addEventListener("pointermove",e=>{if(e.pointerId===pid)moveJoy(e.clientX,e.clientY)});joy.addEventListener("pointerup",up);joy.addEventListener("pointercancel",up);
const dir=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3();

/* --- PROCEDURAL COMPANION --- */
function makeCompanion(){
  const root=new THREE.Group();
  root.name="CompanionPrototype";

  const blue=new THREE.MeshStandardMaterial({color:0x1698d1,roughness:.48,metalness:.03});
  const white=new THREE.MeshStandardMaterial({color:0xf7f2e8,roughness:.55});
  const black=new THREE.MeshStandardMaterial({color:0x17191d,roughness:.38});
  const red=new THREE.MeshStandardMaterial({color:0xe33232,roughness:.46});
  const yellow=new THREE.MeshStandardMaterial({color:0xf1c534,roughness:.42,metalness:.04});

  const add=(geo,mat,pos,scale=[1,1,1])=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(...pos);
    m.scale.set(...scale);
    m.castShadow=true;
    m.receiveShadow=true;
    root.add(m);
    return m;
  };

  // Main rounded toy body
  add(new THREE.CapsuleGeometry(.76,.78,18,32),blue,[0,1.30,0],[1.04,1.03,.92]);

  // Big rounded head
  add(new THREE.SphereGeometry(1,48,32),blue,[0,2.66,0],[1.27,1.18,1.08]);

  // Face panel, sitting naturally on the front
  add(new THREE.SphereGeometry(1,48,32),white,[0,2.55,-.91],[1.00,.84,.24]);

  // Friendly oval eyes
  for(const x of [-.29,.29]){
    add(new THREE.SphereGeometry(1,32,24),white,[x,2.96,-1.06],[.25,.33,.12]);
    add(new THREE.SphereGeometry(.105,24,18),black,[x,2.965,-1.16],[.72,1,.44]);
  }

  // Round red nose
  add(new THREE.SphereGeometry(.14,28,20),red,[0,2.69,-1.18],[1,1,.78]);

  // Very subtle smile: a smooth curved line, not a giant open mouth
  const smileCurve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-.40,2.34,-1.075),
    new THREE.Vector3(-.19,2.24,-1.09),
    new THREE.Vector3(0,2.21,-1.095),
    new THREE.Vector3(.19,2.24,-1.09),
    new THREE.Vector3(.40,2.34,-1.075)
  ]);
  const smile=new THREE.Mesh(new THREE.TubeGeometry(smileCurve,24,.018,6,false),black);
  root.add(smile);

  // Nose-to-mouth line
  add(new THREE.CylinderGeometry(.014,.014,.20,8),black,[0,2.47,-1.095],[1,1,.75]);

  // Whiskers: three thin curved-ish strokes on each side
  const makeWhisker=(side,y,dy)=>{
    const x=side;
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(side*.33,y,-1.065),
      new THREE.Vector3(side*.58,y+dy*.35,-1.045),
      new THREE.Vector3(side*.82,y+dy,-1.02)
    ]);
    root.add(new THREE.Mesh(new THREE.TubeGeometry(curve,12,.010,5,false),black));
  };
  makeWhisker(-1,2.48,.09); makeWhisker(-1,2.56,0); makeWhisker(-1,2.64,-.08);
  makeWhisker(1,2.48,-.09); makeWhisker(1,2.56,0); makeWhisker(1,2.64,.08);

  // Collar and bell
  add(new THREE.TorusGeometry(.70,.075,16,64),red,[0,1.95,0],[1,1,.84]);
  add(new THREE.SphereGeometry(.17,28,20),yellow,[0,1.82,-.68],[1,1,.78]);
  add(new THREE.TorusGeometry(.065,.018,8,24),black,[0,1.79,-.80],[1,1,.7]);

  // Rounded arms
  for(const side of [-1,1]){
    const arm=add(new THREE.CapsuleGeometry(.19,.62,12,24),blue,[side*.87,1.44,-.01],[1,1,.92]);
    arm.rotation.z=side*.43;
    add(new THREE.SphereGeometry(.205,28,20),white,[side*1.15,1.08,-.07],[1.05,.92,1.05]);
  }

  // White belly and raised pocket
  add(new THREE.SphereGeometry(1,40,26),white,[0,1.22,-.70],[.68,.72,.16]);
  add(new THREE.SphereGeometry(1,40,26),white,[0,1.18,-.84],[.50,.38,.07]);

  // Short rounded legs and feet
  for(const side of [-1,1]){
    add(new THREE.CapsuleGeometry(.22,.48,12,24),blue,[side*.38,.72,0],[1,1,.92]);
    add(new THREE.SphereGeometry(.44,32,22),white,[side*.43,.34,-.25],[1.05,.50,1.18]);
  }

  // Small red tail
  add(new THREE.SphereGeometry(.16,24,18),red,[0,1.00,.78],[1,1,.82]);

  return root;
}

const companion=makeCompanion();
scene.add(companion);

const uploadVideo=document.getElementById("uploadVideo");

let videoUrl=null;
const reconStatus=document.getElementById("reconStatus");
const gltfLoader=new GLTFLoader();
let generatedModel=null;
let reconBusy=false;

function setReconStatus(textValue,show=true){
  reconStatus.textContent=textValue;
  reconStatus.style.display=show?"block":"none";
}
function removeGeneratedModel(){
  if(!generatedModel)return;
  scene.remove(generatedModel);
  generatedModel.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>m.dispose&&m.dispose());
    }
  });
  generatedModel=null;
}
async function extractVideoFrames(video){
  const canvas=document.createElement("canvas");
  const max=768;
  const scale=Math.min(1,max/video.videoWidth);
  canvas.width=Math.max(256,Math.round(video.videoWidth*scale));
  canvas.height=Math.max(256,Math.round(video.videoHeight*scale));
  const ctx=canvas.getContext("2d",{willReadFrequently:false});
  const duration=Math.max(.1,video.duration);
  const times=[duration*.12,duration*.37,duration*.62,duration*.87];
  const frames=[];
  for(const t of times){
    await new Promise((resolve,reject)=>{
      const done=()=>{video.removeEventListener("seeked",done);resolve()};
      const fail=()=>{video.removeEventListener("error",fail);reject(new Error("Could not seek video."))};
      video.addEventListener("seeked",done,{once:true});
      video.addEventListener("error",fail,{once:true});
      video.currentTime=t;
    });
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    frames.push(canvas.toDataURL("image/jpeg",.88));
  }
  return frames;
}
async function reconstructUploadedVideo(){
  if(reconBusy)return;
  reconBusy=true;
  try{
    setReconStatus("Extracting 4 views from video…");
    const frames=await extractVideoFrames(modelVideo);
    setReconStatus("Sending views for 3D reconstruction…");
    const create=await fetch("/api/reconstruct",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({frames})
    });
    const cj=await create.json();
    if(!create.ok)throw new Error(cj.error||"Reconstruction service unavailable.");
    const taskId=cj.taskId;
    let lastProgress=-1;
    for(let i=0;i<90;i++){
      await new Promise(r=>setTimeout(r,2500));
      const sr=await fetch("/api/reconstruct-status?taskId="+encodeURIComponent(taskId));
      const sj=await sr.json();
      if(!sr.ok)throw new Error(sj.error||"Could not read reconstruction status.");
      const p=sj.task?.progress;
      if(typeof p==="number"&&p!==lastProgress){
        lastProgress=p;
        setReconStatus("Building 3D model… "+p+"%");
      }
      if(sj.status==="success"){
        if(!sj.modelUrl)throw new Error("3D task finished but returned no GLB model URL.");
        setReconStatus("Loading 3D model…");
        removeGeneratedModel();
        const gltf=await gltfLoader.loadAsync(sj.modelUrl);
        generatedModel=gltf.scene;
        generatedModel.position.set(0,0,0);
        generatedModel.scale.setScalar(2.15);
        generatedModel.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
        scene.add(generatedModel);
        companion.visible=false;
        videoGroup.visible=false;
        setReconStatus("3D model ready ✓",true);
        setTimeout(()=>setReconStatus("",false),2200);
        return;
      }
      if(["failed","cancelled","banned"].includes(sj.status))throw new Error(sj.task?.error_message||"3D reconstruction failed.");
    }
    throw new Error("3D reconstruction timed out.");
  }catch(e){
    setReconStatus("3D reconstruction: "+e.message,true);
    console.error(e);
  }finally{
    reconBusy=false;
  }
}

function clearVideoModel(){\n  removeGeneratedModel();
  if(videoUrl)URL.revokeObjectURL(videoUrl);
  videoUrl=null;
  videoGroup.visible=false;
  videoBadge.style.display="none";
  if(videoSurface.material.map){
    videoSurface.material.map.dispose();
    videoSurface.material.map=null;
    videoSurface.material.needsUpdate=true;
  }
  modelVideo.removeAttribute("src");
  modelVideo.load();
}

uploadVideo.onclick=()=>videoInput.click();

videoInput.addEventListener("change",async()=>{
  const file=videoInput.files&&videoInput.files[0];
  if(!file)return;
  clearVideoModel();
  videoUrl=URL.createObjectURL(file);
  modelVideo.src=videoUrl;

  modelVideo.onloadedmetadata=async()=>{
    const aspect=modelVideo.videoWidth/modelVideo.videoHeight||.7;
    const h=4.4;
    const w=Math.max(2.45,Math.min(3.9,h*aspect));
    videoSurface.geometry.dispose();
    videoSurface.geometry=new THREE.PlaneGeometry(w,h);
    videoFrame.geometry.dispose();
    videoFrame.geometry=new THREE.BoxGeometry(w+.28,h+.28,.12);
    videoGroup.position.set(0,h/2+.05,-.35);
    videoFloor.position.y=-h/2-.13;

    const tex=new THREE.VideoTexture(modelVideo);
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.minFilter=THREE.LinearFilter;
    tex.magFilter=THREE.LinearFilter;
    videoSurface.material.map=tex;
    videoSurface.material.needsUpdate=true;

    videoGroup.visible=true;
    companion.visible=false;
    videoBadge.textContent="Video model preview active";
    videoBadge.style.display="block";
    try{await modelVideo.play()}catch(e){}\n    reconstructUploadedVideo();
  };
});

document.getElementById("reset").addEventListener("dblclick",()=>{
  companion.visible=true;
  clearVideoModel();
  videoInput.value="";
});
let companionTime=0; const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);movement(dt);companionTime+=dt;companion.position.y=Math.sin(companionTime*2.0)*.025;companion.rotation.y=Math.sin(companionTime*.7)*.035;controls.update();renderer.render(scene,camera)}loop();
