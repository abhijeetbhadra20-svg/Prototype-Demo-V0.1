<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Precision | Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070709; }
    .font-syne { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Background Glow Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500/10 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Main Glass Container -->
  <div class="w-full max-w-md bg-white/[0.02] backdrop-blur-2xl border border-white/10 rounded-2xl p-8 shadow-2xl relative z-10 before:absolute before:inset-x-0 before:top-0 before:h-[1px] before:bg-gradient-to-r before:from-transparent before:via-white/20 before:to-transparent">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <span class="text-[10px] font-syne tracking-[0.3em] text-cyan-400 uppercase">System Active</span>
        <h2 class="text-2xl font-syne font-bold text-white tracking-wide mt-1">APEX PRECISION</h2>
      </div>
      <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-xs">01</div>
    </div>

    <!-- Segmented Tab / Pricing Selector -->
    <div class="grid grid-cols-3 gap-2 bg-black/40 p-1.5 rounded-xl border border-white/5 mb-6">
      <button class="py-2 text-xs font-semibold rounded-lg bg-white/10 text-white border border-white/10 shadow-sm transition-all">Sedan</button>
      <button class="py-2 text-xs font-medium rounded-lg text-zinc-400 hover:text-white transition-all">SUV</button>
      <button class="py-2 text-xs font-medium rounded-lg text-zinc-400 hover:text-white transition-all">Exotic</button>
    </div>

    <!-- Price Card -->
    <div class="bg-black/20 rounded-xl p-5 border border-white/5 mb-6">
      <div class="text-zinc-400 text-xs mb-1">Full Paint Protection (PPF)</div>
      <div class="flex items-baseline justify-between">
        <span class="text-3xl font-syne font-extrabold text-white tracking-tight">$1,499</span>
        <span class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">Instant Quote</span>
      </div>
    </div>

    <!-- Micro-Rounded CTA Button -->
    <button class="w-full py-4 bg-white text-black font-syne font-bold text-xs uppercase tracking-[0.15em] rounded-xl hover:bg-zinc-200 transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
      Reserve Studio Slot
    </button>
  </div>

</body>
</html>
