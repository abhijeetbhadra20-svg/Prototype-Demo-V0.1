<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Companion Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        camera.position.set(0, 1, 4);

        let mixer, character, animations = {};

        // Local robot.glb file load kar rahe hain
        const loader = new THREE.GLTFLoader();
        loader.load('./robot.glb', (gltf) => {
            character = gltf.scene;
            
            character.scale.set(0.7, 0.7, 0.7);
            character.position.set(0, -1, 0);
            scene.add(character);

            // Agar model me built-in animation hai toh play karega
            if (gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(character);
                gltf.animations.forEach((clip) => {
                    animations[clip.name] = mixer.clipAction(clip);
                });
                const firstAnim = Object.keys(animations)[0];
                if (firstAnim) animations[firstAnim].play();
            }
        });

        // Touch Reaction (Touch par fast spin / Gudgudi effect)
        let isTouching = false;
        window.addEventListener('pointerdown', () => { isTouching = true; });
        window.addEventListener('pointerup', () => { isTouching = false; });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            
            if (character) {
                if (isTouching) {
                    character.rotation.y += 0.1;
                } else {
                    character.rotation.y += 0.005;
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
