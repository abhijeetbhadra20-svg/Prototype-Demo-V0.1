<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Project Gadget AI — 3D Environment V0.2</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#viewport{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#info,#toolbar,#status,#joystick,#error-screen{position:fixed;z-index:20}
#info{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:10px 12px;min-width:220px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(8,8,10,.82);backdrop-filter:blur(10px);pointer-events:none;user-select:none}
#info-title{font-size:13px;font-weight:700}
#info-subtitle{margin-top:3px;font-size:10px;color:rgba(255,255,255,.48)}
#camera-readout{margin-top:6px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(190,205,225,.62)}
#toolbar{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:min(70vw,500px)}
button{appearance:none;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:8px 10px;color:rgba(255,255,255,.9);background:rgba(8,8,10,.82);font:11px inherit;cursor:pointer;user-select:none;backdrop-filter:blur(10px)}
button:active{transform:translateY(1px) scale(.98)}
#status{left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 10px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(3,3,4,.78);color:rgba(255,255,255,.48);font-size:10px;white-space:nowrap;pointer-events:none}
#joystick{left:max(18px,env(safe-area-inset-left));bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));width:112px;height:112px;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:inset 0 0 30px rgba(255,255,255,.025);touch-action:none;display:none}
#joystick-knob{position:absolute;width:45px;height:45px;left:50%;top:50%;margin:-22.5px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 20px rgba(0,0,0,.45);pointer-events:none}
#joystick-label{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.3);white-space:nowrap}
#error-screen{inset:0;display:none;align-items:center;justify-content:center;padding:25px;background:#000;text-align:center;z-index:100}
#error-box{width:min(500px,100%);padding:25px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#080808}
#error-box h2{margin:0 0 10px;font-size:18px}
#error-box p{margin:0;line-height:1.6;font-size:13px;color:rgba(255,255,255,.55)}
@media(max-width:700px){
#info{min-width:0}
#camera-readout{display:none}
#toolbar{max-width:52vw}
#toolbar button{padding:7px 8px;font-size:10px}
#joystick{display:block}
#status{font-size:9px}
}
</style>
</head>

<body>
<div id="viewport"></div>

<div id="info">
  <div id="info-title">Project Gadget AI · 3D Environment</div>
  <div id="info-subtitle">Blender-style viewport · V0.2</div>
  <div id="camera-readout">Camera: 0, 0, 0</div>
</div>

<div id="toolbar">
  <button id="reset-btn">Reset</button>
  <button id="grid-btn">Grid</button>
  <button id="axes-btn">Axes</button>
  <button id="speed-btn">Speed 1x</button>
  <button id="fullscreen-btn">Fullscreen</button>
</div>

<div id="status">Desktop: orbit · wheel zoom · right-drag pan · WASD move</div>

<div id="joystick">
  <div id="joystick-knob"></div>
  <div id="joystick-label">MOVE</div>
</div>

<div id="error-screen">
  <div id="error-box">
    <h2>3D renderer could not start</h2>
    <p id="error-text">Your browser/device could not create a WebGL renderer.</p>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const viewport=document.getElementById("viewport");
const cameraReadout=document.getElementById("camera-readout");
const status=document.getElementById("status");
const joystick=document.getElementById("joystick");
const joystickKnob=document.getElementById("joystick-knob");
const errorScreen=document.getElementById("error-screen");
const errorText=document.getElementById("error-text");

const isMobile=window.matchMedia("(pointer: coarse)").matches||innerWidth<700;

let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"});
}catch(e){
  errorScreen.style.display="flex";
  errorText.textContent="WebGL renderer initialization failed. Try another browser or enable hardware acceleration.";
  throw e;
}

renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.5:2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.setClearColor(0x000000,1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.03,4000);
const DEFAULT_CAMERA=new THREE.Vector3(8,5.5,10);
const DEFAULT_TARGET=new THREE.Vector3(0,.4,0);
camera.position.copy(DEFAULT_CAMERA);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(DEFAULT_TARGET);
controls.enableDamping=true;
controls.dampingFactor=.075;
controls.enableRotate=true;
controls.enablePan=true;
controls.enableZoom=true;
controls.rotateSpeed=.75;
controls.panSpeed=.85;
controls.zoomSpeed=1;
controls.minDistance=.15;
controls.maxDistance=1500;
controls.minPolarAngle=.05;
controls.maxPolarAngle=Math.PI*.495;
controls.screenSpacePanning=true;
controls.zoomToCursor=true;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;
controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;

const gridRoot=new THREE.Group();
scene.add(gridRoot);

const minorGrid=new THREE.GridHelper(600,600,0x32404d,0x121a22);
minorGrid.material.transparent=true;
minorGrid.material.opacity=.78;
gridRoot.add(minorGrid);

const majorGrid=new THREE.GridHelper(600,60,0x596d80,0x25323e);
majorGrid.material.transparent=true;
majorGrid.material.opacity=.52;
gridRoot.add(majorGrid);

const originGroup=new THREE.Group();
scene.add(originGroup);

const originRing=new THREE.Mesh(
  new THREE.RingGeometry(.22,.25,48),
  new THREE.MeshBasicMaterial({color:0x8aa0b4,transparent:true,opacity:.65,side:THREE.DoubleSide})
);
originRing.rotation.x=-Math.PI/2;
originRing.position.y=.006;
originGroup.add(originRing);

const originDot=new THREE.Mesh(
  new THREE.CircleGeometry(.045,24),
  new THREE.MeshBasicMaterial({color:0xb8c8d6,transparent:true,opacity:.9})
);
originDot.rotation.x=-Math.PI/2;
originDot.position.y=.008;
originGroup.add(originDot);

const axes=new THREE.AxesHelper(2);
axes.visible=false;
scene.add(axes);

const marker=new THREE.Mesh(
  new THREE.SphereGeometry(.1,20,14),
  new THREE.MeshBasicMaterial({color:0x91a4b5})
);
marker.position.y=.1;
scene.add(marker);

const GRID_SNAP=10;
function updateGridPosition(){
  gridRoot.position.x=Math.floor(camera.position.x/GRID_SNAP)*GRID_SNAP;
  gridRoot.position.z=Math.floor(camera.position.z/GRID_SNAP)*GRID_SNAP;
}

const pressedKeys=new Set();
addEventListener("keydown",e=>{
  if(e.target?.tagName==="INPUT"||e.target?.tagName==="TEXTAREA")return;
  pressedKeys.add(e.key.toLowerCase());
});
addEventListener("keyup",e=>pressedKeys.delete(e.key.toLowerCase()));

const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const up=new THREE.Vector3(0,1,0);
const movement=new THREE.Vector3();

const speedLevels=[.5,1,2,4];
let speedIndex=1;
const baseMoveSpeed=7;
const joystickInput={x:0,y:0};

function updateMovement(dt){
  let x=0,z=0,y=0;
  if(pressedKeys.has("a")||pressedKeys.has("arrowleft"))x-=1;
  if(pressedKeys.has("d")||pressedKeys.has("arrowright"))x+=1;
  if(pressedKeys.has("w")||pressedKeys.has("arrowup"))z+=1;
  if(pressedKeys.has("s")||pressedKeys.has("arrowdown"))z-=1;
  if(pressedKeys.has("e")||pressedKeys.has(" "))y+=1;
  if(pressedKeys.has("q"))y-=1;

  x+=joystickInput.x;
  z+=-joystickInput.y;

  const len=Math.hypot(x,z);
  if(len>1){x/=len;z/=len;}

  if(Math.abs(x)<.001&&Math.abs(z)<.001&&Math.abs(y)<.001)return;

  forward.subVectors(controls.target,camera.position);
  forward.y=0;
  if(forward.lengthSq()<1e-10)forward.set(0,0,-1);
  forward.normalize();
  right.crossVectors(forward,up).normalize();

  const distance=baseMoveSpeed*speedLevels[speedIndex]*dt;
  movement.set(0,0,0);
  movement.addScaledVector(right,x*distance);
  movement.addScaledVector(forward,z*distance);
  movement.y+=y*distance;

  camera.position.add(movement);
  controls.target.add(movement);
}

let joystickPointerId=null;

function updateJoystick(clientX,clientY){
  const rect=joystick.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  let dx=clientX-cx;
  let dy=clientY-cy;
  const max=rect.width*.33;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joystickInput.x=dx/max;
  joystickInput.y=dy/max;
  joystickKnob.style.transform=`translate(${dx}px,${dy}px)`;
}

function resetJoystick(){
  joystickInput.x=0;
  joystickInput.y=0;
  joystickKnob.style.transform="translate(0,0)";
  joystickPointerId=null;
}

joystick.addEventListener("pointerdown",e=>{
  joystickPointerId=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e.clientX,e.clientY);
});
joystick.addEventListener("pointermove",e=>{
  if(e.pointerId===joystickPointerId)updateJoystick(e.clientX,e.clientY);
});
joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);
joystick.addEventListener("lostpointercapture",resetJoystick);

function resetCamera(){
  camera.position.copy(DEFAULT_CAMERA);
  controls.target.copy(DEFAULT_TARGET);
  controls.update();
  updateGridPosition();
  saveCamera();
}

const STORAGE_KEY="project-gadget-ai-camera-v02";

function saveCamera(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      position:camera.position.toArray(),
      target:controls.target.toArray()
    }));
  }catch{}
}

function restoreCamera(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!data?.position||!data?.target)return;
    camera.position.fromArray(data.position);
    controls.target.fromArray(data.target);
    controls.update();
  }catch{}
}
restoreCamera();

document.getElementById("reset-btn").onclick=resetCamera;

document.getElementById("grid-btn").onclick=e=>{
  gridRoot.visible=!gridRoot.visible;
  e.currentTarget.textContent=gridRoot.visible?"Grid":"Grid Off";
};

document.getElementById("axes-btn").onclick=e=>{
  axes.visible=!axes.visible;
  e.currentTarget.textContent=axes.visible?"Axes On":"Axes";
};

document.getElementById("speed-btn").onclick=e=>{
  speedIndex=(speedIndex+1)%speedLevels.length;
  e.currentTarget.textContent=`Speed ${speedLevels[speedIndex]}x`;
};

document.getElementById("fullscreen-btn").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch{}
};

let saveTimer=null;
controls.addEventListener("change",()=>{
  updateGridPosition();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveCamera,350);
});

let infoTimer=0;
function updateCameraReadout(dt){
  infoTimer+=dt;
  if(infoTimer<.1)return;
  infoTimer=0;
  cameraReadout.textContent=`Camera: ${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}`;
}

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.5:2));
  renderer.setSize(innerWidth,innerHeight,false);
}
addEventListener("resize",resize);

const clock=new THREE.Clock();

function render(){
  const dt=Math.min(clock.getDelta(),.05);
  updateMovement(dt);
  updateGridPosition();
  marker.rotation.y+=dt*.25;

  const pulse=1+Math.sin(performance.now()*.002)*.03;
  originRing.scale.set(pulse,pulse,pulse);

  controls.update();
  updateCameraReadout(dt);
  renderer.render(scene,camera);
}

resize();
updateGridPosition();
controls.update();
renderer.setAnimationLoop(render);

if(isMobile){
  status.textContent="One finger = orbit · Two fingers = pan/zoom · Joystick = move";
}

renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

console.log("Project Gadget AI Environment V0.2 initialized.");
</script>
</body>
</html>
