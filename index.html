<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Companion Tutor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        camera.position.set(0, 1, 3.5);

        let character;

        // Public Doraemon 3D Model URL
        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/PatelPratham/Doraemon-3D-Model/main/doraemon.glb', (gltf) => {
            character = gltf.scene;
            character.scale.set(0.5, 0.5, 0.5);
            character.position.set(0, -1, 0);
            scene.add(character);
        }, undefined, (err) => {
            console.error("Model Loading Error:", err);
        });

        // Touch Interaction
        let isSpinning = false;
        window.addEventListener('pointerdown', () => {
            isSpinning = true;
            setTimeout(() => { isSpinning = false; }, 800);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (character) {
                if (isSpinning) {
                    character.rotation.y += 0.15;
                } else {
                    character.rotation.y += 0.005;
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
